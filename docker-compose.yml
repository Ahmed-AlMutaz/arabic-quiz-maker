services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8010:7860"
    environment:
      - QDRANT_HOST=qdrant
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./storage:/app/storage
    depends_on:
      - qdrant
      - mongo
      - redis

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6335:6333"
      - "6336:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  mongo:
    image: mongo:6.0
    ports:
      - "27018:27017"
    volumes:
      - mongo_storage:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6378:6379"

volumes:
  qdrant_storage:
  mongo_storage:
